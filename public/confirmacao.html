<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inscrição — EBA Cuiabá Sul 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
.confirm-page{max-width:560px;margin:8vh auto;padding:0 20px}
.confirm-box{background:#111;border:1px solid #2a2a2a;padding:36px;text-align:center}
.icon{font-size:64px;margin-bottom:16px}
.confirm-box h1{font-family:Anton;font-size:38px;margin:0 0 8px}
.confirm-box .ref{color:#666;font-size:13px;letter-spacing:1px;margin-bottom:24px}
.confirm-info{background:#0c0c0c;border:1px solid #1a1a1a;padding:18px;text-align:left;margin-bottom:24px}
.confirm-info p{margin:5px 0;font-size:15px;color:#ccc;line-height:1.6}
.confirm-info strong{color:#f3df9a}
.info-box{padding:18px;text-align:left;margin-bottom:24px}
.info-box h4{margin:0 0 10px;font-size:14px;letter-spacing:1px;text-transform:uppercase}
.info-box p{font-size:14px;margin:4px 0;line-height:1.6}
.presencial-box{background:#0d1a2e;border:1px solid #1e3a5f}
.presencial-box h4{color:#818cf8}.presencial-box p{color:#a5b4fc}
.online-box{background:#2a1f05;border:1px solid #92400e}
.online-box h4{color:#fbbf24}.online-box p{color:#fcd34d}
.paid-box{background:#0d2b18;border:1px solid #166534}
.paid-box h4{color:#4ade80}.paid-box p{color:#bbf7d0}
.confirm-actions{display:flex;flex-direction:column;gap:10px}
.confirm-actions a{text-align:center}
.back-link{color:#666;font-size:13px;margin-top:16px;display:block}
.back-link:hover{color:#fff}
</style>
</head>
<body>
<div class="confirm-page">
  <div class="confirm-box" id="confirmBox">
    <div class="icon">⏳</div>
    <h1>CARREGANDO…</h1>
  </div>
</div>
<footer class="site-footer">
  <div class="sf-dev">
    <span>Desenvolvido por <b>WeCare Consultoria</b> • © 2026 Todos os direitos reservados</span>
    <a class="sf-btn" href="https://wecareconsultoria.com.br" target="_blank" rel="noopener">wecareconsultoria.com.br ↗</a>
  </div>
  <a class="sf-privacy" href="/privacidade">Política de privacidade</a>
</footer>
<script src="/confirmacao.js"></script>
</body>
</html>
