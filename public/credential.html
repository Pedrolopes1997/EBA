<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080808">
<meta name="robots" content="noindex">
<title>Credencial — EBA Cuiabá Sul 2026</title>
<link rel="icon" href="/assets/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
.cred-page{max-width:880px;margin:0 auto;padding:30px 16px 50px}
.cred-top{text-align:center;margin-bottom:18px}
.cred-top a{color:#888;text-decoration:none;font-size:13px;letter-spacing:1px}
.status-banner{display:flex;align-items:center;gap:14px;padding:16px 18px;margin-bottom:16px;border:1px solid}
.status-banner .ico{font-size:34px;line-height:1}
.status-banner b{display:block;font-family:Anton;font-size:26px;letter-spacing:.5px;font-weight:400}
.status-banner span{font-size:14px;opacity:.9}
.st-ok{background:#0d2b18;border-color:#166534;color:#bbf7d0}.st-ok b{color:#4ade80}
.st-used{background:#2a1f05;border-color:#92400e;color:#fde68a}.st-used b{color:#fbbf24}
.st-bad{background:#2d0e0e;border-color:#7f1d1d;color:#fecaca}.st-bad b{color:#f87171}
.intro{color:#bdb5a4;font-size:15px;line-height:1.6;margin:0 0 16px}
.intro b{color:#f3df9a}

.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.cards.single{grid-template-columns:minmax(0,440px);justify-content:center}
.ticket-card{background:linear-gradient(160deg,#171717,#0a0a0a);border:1px solid #2e2e2e;position:relative;overflow:hidden;display:flex;flex-direction:column}
.ticket-card:before{content:"";position:absolute;top:0;left:0;right:0;height:5px;background:var(--red)}
.tc-head{padding:20px 20px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.tc-head h2{font-family:Anton;font-size:24px;line-height:1;margin:0;color:var(--cream);font-weight:400}
.tc-head h2 small{display:block;font-family:Oswald;font-size:11px;letter-spacing:3px;color:var(--red);margin-bottom:5px}
.tc-type{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:3px 8px;border:1px solid #444;color:#ccc;white-space:nowrap}
.tc-type.t-irmao{border-color:#7f1d1d;color:#fca5a5}.tc-type.t-cunhada{border-color:#6b21a8;color:#d8b4fe}
.tc-type.t-crianca{border-color:#1e40af;color:#93c5fd}.tc-type.t-crianca_free{border-color:#166534;color:#86efac}
.tc-qr{padding:18px 20px 8px;text-align:center;position:relative}
.tc-qr img{width:min(100%,250px);aspect-ratio:1;background:#fff;padding:8px;border-radius:6px;display:block;margin:0 auto}
.tc-name{padding:6px 20px 0;text-align:center}
.tc-name b{display:block;font-size:22px;color:#fff;font-weight:600;line-height:1.2}
.tc-name span{display:block;color:#8a8a8a;font-size:13px;margin-top:4px}
.tc-used{position:absolute;top:44%;left:50%;transform:translate(-50%,-50%) rotate(-12deg);border:4px solid #fbbf24;color:#fbbf24;font-family:Anton;font-size:30px;padding:2px 14px;background:#000d;letter-spacing:2px;white-space:nowrap}
.tc-entered{display:block;color:#fbbf24;font-size:12px;margin-top:4px}
.tc-actions{margin-top:auto;padding:16px 20px 20px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.tc-actions .btn{clip-path:none;padding:11px 14px;font-size:13px}
.btn-dark{background:#1b1b1b!important;border:1px solid #3a3a3a!important}
.btn-dark:hover{background:#262626!important}

.group-list{background:#0e0e0e;border:1px solid #222;padding:14px 18px;margin-top:16px}
.group-list h3{font-family:Anton;font-size:18px;margin:0 0 8px;color:var(--cream);font-weight:400}
.group-list p{margin:3px 0;color:#ccc;font-size:14px}
.event-box{margin-top:16px;background:#0e0e0e;border:1px solid #222;padding:18px 20px}
.event-box h3{font-family:Anton;font-size:22px;margin:0 0 10px;color:var(--cream);font-weight:400}
.event-row{display:grid;grid-template-columns:62px 1fr;gap:12px;padding:10px 0;border-top:1px solid #1c1c1c}
.event-row:first-of-type{border-top:0}
.event-row b{font-family:Anton;font-size:30px;color:var(--red);line-height:1;font-weight:400}
.event-row b small{display:block;font-family:Oswald;font-size:11px;color:#999;letter-spacing:1px}
.event-row p{margin:0;color:#ccc;font-size:14px;line-height:1.5}
.event-row p strong{color:#f3ecd9}
.event-row a{color:var(--cream)}
.cred-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.cred-actions .btn{text-align:center;clip-path:none;padding:15px 10px}
.note{color:#777;font-size:12px;text-align:center;margin-top:14px;line-height:1.6}
.note a{color:#aaa}
.hidden{display:none!important}

@media(max-width:680px){.cards{grid-template-columns:1fr}.tc-head h2{font-size:22px}.cred-actions{grid-template-columns:1fr}}
@media print{
  body{background:#fff!important}body:before,.cred-top,.status-banner,.cred-actions,.note,.event-box,.tc-actions,.intro,.group-list,.site-footer{display:none!important}
  .cred-page{padding:0;max-width:none}.cards{grid-template-columns:1fr 1fr;gap:10px}
  .ticket-card{border:2px solid #000;background:#fff!important;break-inside:avoid}
  .tc-head h2,.tc-name b{color:#000!important}
}
</style>
</head>
<body>
<main class="cred-page">
  <div class="cred-top"><a href="/">← EBA CUIABÁ SUL 2026</a></div>
  <div id="content"><div class="status-banner st-used"><div class="ico">⏳</div><div><b>CARREGANDO…</b></div></div></div>
</main>
<footer class="site-footer">
  <div class="sf-dev">
    <span>Desenvolvido por <b>WeCare Consultoria</b> • © 2026 Todos os direitos reservados</span>
    <a class="sf-btn" href="https://wecareconsultoria.com.br" target="_blank" rel="noopener">wecareconsultoria.com.br ↗</a>
  </div>
  <a class="sf-privacy" href="/privacidade">Política de privacidade</a>
</footer>
<script src="/credential.js"></script>
</body>
</html>
